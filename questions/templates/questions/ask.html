{% extends 'base.html' %}

{% block title %}AskPupkin - New Question{% endblock %}

{% block content %}
<section class="form-section">
  <div class="content-header">
    <h1 id="page-title">New Question</h1>
  </div>

  <form action="{% url 'ask' %}" method="POST" class="ask-form">
    {% csrf_token %}
    <div class="form-group">
      <label for="question-title">Title</label>
      <input
        type="text"
        id="question-title"
        name="title"
        placeholder="How to build a moon park?"
        required
      />
    </div>

    <div class="form-group">
      <label for="question-text">Text</label>
      <textarea
        id="question-text"
        name="text"
        placeholder="Really, how? Have no idea about it"
        required
      ></textarea>
    </div>

    <div class="form-group">
      <label for="question-tags">Tags</label>
      <input
        type="text"
        id="question-tags"
        name="tags"
        placeholder="moon, park, puzzle"
        required
      />
    </div>

    <button type="submit" class="submit-btn">ASK!</button>
  </form>
</section>
{% endblock %}

{% if page_obj.has_other_pages %}
<div class="pagination">
    {# Кнопка «Назад» #}
    {% if page_obj.has_previous %}
        <a href="?page={{ page_obj.previous_page_number }}" class="page-num">Prev</a>
    {% endif %}

    {# Текущая страница (активная) #}
    <span class="page-num active" style="background-color: #fc9803; color: #1c1a17; padding: 5px 10px; margin: 0 3px; border-radius: 4px; font-weight: bold;">
        {{ page_obj.number }}
    </span>

    {# Кнопка «Вперед» #}
    {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}" class="page-num">Next</a>
    {% endif %}
</div>
{% endif %}

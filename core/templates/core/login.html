{% extends 'base.html' %}

{% block title %}AskPupkin - Login{% endblock %}

{% block content %}
<div class="form-section">
    <div class="content-header">
        <span id="page-title">Log In</span>
    </div>

    <div class="form-error">Sorry, wrong password or login!</div>

    <form action="{% url 'login' %}" method="POST" class="ask-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="login">Login</label>
            <div>
                <input type="text" id="login" name="username" value="dr_pepper" minlength="4" maxlength="32" required class="settings-form">
                <small class="field-hint">4–32 characters</small>
            </div>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <div>
                <input type="password" id="password" name="password" minlength="8" maxlength="64" required class="settings-form">
                <small class="field-error">Password is too short (min 8 chars)</small>
            </div>
        </div>
        <button type="submit" class="submit-btn">Log in!</button>
    </form>
</div>
{% endblock %}

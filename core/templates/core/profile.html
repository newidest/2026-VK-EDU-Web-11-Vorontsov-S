{% extends 'base.html' %}

{% block title %}AskPupkin - Settings{% endblock %}

{% block content %}
<div class="form-section">
    <div class="content-header">
        <span id="page-title">Settings: Dr. Zoidberg</span>
    </div>
    <form action="{% url 'profile' %}" method="POST" class="ask-form" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label for="login">Login</label>
            <input type="text" id="login" name="username" value="dr_zoidberg" class="settings-form">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="zoidberg@planet-express.com" class="settings-form">
        </div>
        <div class="form-group">
            <label for="nick">NickName</label>
            <input type="text" id="nick" name="nick" value="Dr. Zoidberg" class="settings-form">
        </div>
        <div class="form-group">
            <label for="avatar-upload">Avatar</label>
            <input type="file" id="avatar-upload" name="avatar" class="settings-form">
        </div>
        <button type="submit" class="submit-btn">Save</button>
    </form>
</div>
{% endblock %}
